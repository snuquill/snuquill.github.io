---
layout: default
title: Archives
permalink: /archives/
---

<div class="archives-page-container">
  <div class="archives-name">
    <h3>Issue</h3>
  </div>

  <div class="archives-container">
    {% for issue in site.data.archives %}
    <div
      class="magazine-card"
      onclick="window.open('{{ issue.pdf }}')">

      <div class="magazine-cover-img-container">
        <img
          src="{{ issue.cover_image }}"
          alt="Volume {{ issue.volume }} cover">
      </div>

      <div class="volume-number-container">
        Volume {{ issue.volume }}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
