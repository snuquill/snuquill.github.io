---
layout: default
title: Archives
permalink: /archives/3/
---

{% assign archives = site.data.archives | sort: "volume" | reverse %}

<div class="archives-page-container">
  <div class="archives-name">
    <h3>Issue</h3>
  </div>

  <div class="archives-container">
{% for issue in archives offset:24 limit:12 %}    <div class="magazine-card" onclick="window.open('{{ issue.pdf }}')">

      <div class="magazine-cover-img-container">
        <img src="{{ issue.cover_image }}" alt="Volume {{ issue.volume }} cover">
      </div>

      <div class="volume-number-container">
        Volume {{ issue.volume }}
      </div>

    </div>
    {% endfor %}
  </div>
    <div class="page-flipper-container">
        <a class="page-element prev" href="/archives/0" style="display:none;">0</a><a class="page-element" href="/archives/1">1</a><a class="page-element" href="/archives/2">2</a><a class="page-element current-element" href="/archives/3">3</a><a class="page-element" href="/archives/4">4</a><a class="page-element" href="/archives/5">5</a><a class="page-element next" href="/archives/6" style="display:none;">6</a>
    </div>
</div>
